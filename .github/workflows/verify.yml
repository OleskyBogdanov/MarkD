name: Verify desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps:deprecated
      - run: npm test
      - run: npm run test:e2e
      - if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Archive macOS application for manual installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          arch=$(node -p "process.arch")
          app_dir=mac
          if [ "$arch" = arm64 ]; then app_dir=mac-arm64; fi
          ditto -c -k --sequesterRsrc --keepParent "dist-package/$app_dir/MarkD.app" "dist-package/MarkD-$version-$arch.zip"
      - if: runner.os == 'Windows'
        run: npm run package:win
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-package/MarkD-Setup-*.exe | Select-Object -First 1).FullName
          $installDir = "$env:RUNNER_TEMP\MarkD-installed"
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS failed: $($process.ExitCode)" }
          $env:MARKD_SMOKE_EXE = "$installDir\MarkD.exe"
          npm run smoke:win
      - name: Upload verified manual installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-package/MarkD-*.zip
            dist-package/MarkD-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
